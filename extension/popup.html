<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FORGE</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <h1>FORGE <span>reader</span></h1>
  <p class="pill" id="state">checking server…</p>

  <button id="selection" class="primary">Read Aloud</button>
  <button id="page">Read Aloud — whole page</button>
  <button id="stop">Stop</button>

  <label class="row">Language <select id="lang"><option value="en">en</option></select></label>
  <label class="row">Speed <input id="speed" type="range" min="0.6" max="1.6" step="0.05" value="1">
    <output id="speed-out">1.00×</output></label>

  <p class="small" id="hint">
    Tip: the fastest route is on the page itself. Select text and right-click →
    <strong>Read Aloud</strong>, or right-click any paragraph → <strong>Read Aloud
    — from here</strong> to read from there to the end of the article.
    The player runs inside the page, so this popup can close.
    <a href="#" id="options">Settings</a>
  </p>

  <script src="popup.js"></script>
</body>
</html>
